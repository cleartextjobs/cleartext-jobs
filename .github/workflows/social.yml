name: Post jobs to Facebook and Instagram

on:
  # No schedule while there is no Meta key: the week's posts are prepared by social-pack.yml.
  # With FB_PAGE_ID and FB_PAGE_TOKEN set, add back:
  #   schedule:
  #     - cron: "43 8 * * 1,3,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only: make the text and images, publish nothing"
        type: boolean
        default: true
      weekday:
        description: "Theme: 1 = Portugal, 3 = remote Europe, 5 = Portugal and Spain"
        type: choice
        options: ["1", "3", "5"]
        default: "1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the rules
        run: node test/run.mjs && node test/social.mjs
      - name: Collect jobs
        run: node src/collect.mjs
      - name: Choose today's jobs
        env:
          WEEKDAY: ${{ github.event_name == 'workflow_dispatch' && inputs.weekday || '' }}
        run: node src/social.mjs --plan
      - name: Install Chromium
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Render the carousel images
        run: node src/render.mjs
      - name: Keep the text and images for download
        uses: actions/upload-artifact@v4
        with:
          name: social-post
          path: |
            social-out/
            site/social/
          if-no-files-found: ignore
      - if: ${{ !inputs.dry_run }}
        uses: actions/configure-pages@v5
      - if: ${{ !inputs.dry_run }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  post:
    needs: deploy
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: social-post
      - name: Wait for the images to be online
        run: sleep 60
      - name: Publish on Facebook and Instagram
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: node src/social.mjs --post
